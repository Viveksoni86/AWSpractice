
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            padding: 50px;
        }

        h1 {
            color: blue;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website!</h1>

    <p>This is my first simple HTML page.</p>

    <button onclick="alert('Hello! Welcome to my website.')">
        Click Me
    </button>

</body>
</html>
